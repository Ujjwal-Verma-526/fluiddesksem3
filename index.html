<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Syllabus-mapped study desk for ME205 Fluid Mechanics & Hydraulic Machines: statics, kinematics, dynamics, viscous and pipe flow, boundary layers, jets and turbines, with past and generated end-term papers." />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath d='M3.5 12C3.5 8.6 6.4 7 9.6 7C14 7 18 9.6 21 12C18 14.4 14 17 9.6 17C6.4 17 3.5 15.4 3.5 12Z' fill='%23ddeff0' stroke='%230e6b73' stroke-width='2' stroke-linejoin='round'/%3E%3C/svg%3E"
    />
    <title>Fluid Desk</title>
    <script>
      // Apply the saved theme before first paint to avoid a flash.
      try {
        var saved = JSON.parse(localStorage.getItem('fluid-desk:v1') || '{}').theme
        if (saved === 'light' || saved === 'dark') document.documentElement.dataset.theme = saved
      } catch (e) {
        /* storage unavailable: fall back to the system theme */
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
